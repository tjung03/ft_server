<text x="816" y="196" font-size="19" font-weight="700" fill="#086b62">MariaDB</text>
<text x="816" y="225" font-size="14" fill="#263a54">wordpress DB</text>

<rect x="385" y="307" width="365" height="76" rx="10" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="405" y="336" font-size="18" font-weight="700" fill="#163b76">/var/www/html</text>
<text x="405" y="361" font-size="14" fill="#263a54">WordPress · phpMyAdmin · 정적 파일</text>

