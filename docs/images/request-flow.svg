<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">ft_server · 요청 처리 구조</title><desc id="desc">하나의 Docker 컨테이너 안에서 Nginx가 80과 443 요청을 받고, 정적 파일은 직접 제공하며 PHP 요청은 PHP-FPM으로 전달한다. WordPress와 phpMyAdmin은 같은 컨테이너의 MariaDB에 연결한다.</desc>
