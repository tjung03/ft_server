<text x="32" y="74" font-size="16" fill="#4b5e78">Nginx · PHP-FPM · MariaDB를 하나의 컨테이너에 구성</text>
<rect x="32" y="104" width="205" height="275" rx="12" fill="#fff6ea" stroke="#e5cba9"/>
<text x="52" y="137" font-size="19" font-weight="700" fill="#946018">Client</text><text x="52" y="168" font-size="16" fill="#263a54">Browser / curl</text>
<text x="52" y="222" font-size="15" fill="#263a54">HTTP :80</text><text x="52" y="250" font-size="15" fill="#263a54">HTTPS :443</text>
<rect x="277" y="104" width="691" height="275" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="297" y="137" font-size="17" font-weight="700" fill="#4865a0">하나의 Docker 컨테이너</text>
