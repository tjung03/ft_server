<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">ft_server · 요청 처리 구조</title><desc id="desc">Browser와 curl 요청이 하나의 Docker 컨테이너 안의 Nginx로 들어온다. HTTP는 HTTPS로 전환되고, 정적 파일은 Nginx가 제공한다. PHP 요청은 Unix socket을 통해 PHP-FPM으로 전달되며 WordPress와 phpMyAdmin의 PHP 코드는 같은 컨테이너의 MariaDB를 사용한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="500" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">ft_server · 요청 처리 구조</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">Nginx · PHP-FPM · MariaDB를 하나의 Docker 컨테이너에 구성</text>

<rect x="32" y="145" width="170" height="155" rx="12" fill="#fff6ea" stroke="#e5cba9"/>
<text x="52" y="180" font-size="20" font-weight="700" fill="#946018">Client</text>
<text x="52" y="211" font-size="16" fill="#263a54">Browser / curl</text>
<text x="52" y="247" font-size="14" fill="#263a54">HTTP :80</text>
<text x="52" y="273" font-size="14" fill="#263a54">HTTPS :443</text>

<rect x="246" y="105" width="722" height="320" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="266" y="137" font-size="17" font-weight="700" fill="#4865a0">하나의 Docker 컨테이너</text>

<rect x="282" y="166" width="205" height="96" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="302" y="196" font-size="20" font-weight="700" fill="#163b76">Nginx</text>
<text x="302" y="225" font-size="14" fill="#263a54">:80 → HTTPS 301</text>
<text x="302" y="248" font-size="14" fill="#263a54">:443 · Static / FastCGI</text>

<rect x="539" y="166" width="205" height="96" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="559" y="196" font-size="20" font-weight="700" fill="#163b76">PHP 7.3-FPM</text>
