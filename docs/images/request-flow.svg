<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">ft_server · 요청 처리 흐름</title>
<desc id="desc">Client 요청은 Nginx로 들어온다. 80 포트는 HTTPS로 전환되고 443 포트에서 정적 파일은 Nginx가 직접 제공한다. PHP 요청은 PHP-FPM으로 전달되며 WordPress와 phpMyAdmin의 PHP 코드는 MariaDB를 사용한다.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker>
</defs>
<rect width="1000" height="430" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">ft_server · 요청 처리 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">HTTP Redirect · Static File · FastCGI · Database</text>

<rect x="54" y="145" width="170" height="100" rx="12" fill="#fff6ea" stroke="#e5cba9"/>
<text x="76" y="180" font-size="20" font-weight="700" fill="#946018">Client</text>
<text x="76" y="210" font-size="15" fill="#263a54">Browser / curl</text>

<rect x="290" y="130" width="210" height="130" rx="12" fill="#edf2ff" stroke="#b8c7e3"/>
<text x="312" y="165" font-size="21" font-weight="700" fill="#163b76">Nginx</text>
<text x="312" y="196" font-size="15" fill="#263a54">:80 → HTTPS 301</text>
<text x="312" y="222" font-size="15" fill="#263a54">:443 요청 처리</text>

<rect x="565" y="116" width="190" height="86" rx="12" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="587" y="148" font-size="19" font-weight="700" fill="#163b76">Static Files</text>
<text x="587" y="177" font-size="14" fill="#263a54">/var/www/html</text>

<rect x="565" y="240" width="190" height="86" rx="12" fill="#f5f8ff" stroke="#cbd5e1"/>
<text x="587" y="272" font-size="19" font-weight="700" fill="#163b76">PHP 7.3-FPM</text>
<text x="587" y="301" font-size="14" fill="#263a54">Unix Socket</text>

<rect x="820" y="240" width="140" height="86" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>
<text x="840" y="272" font-size="18" font-weight="700" fill="#086b62">MariaDB</text>
<text x="840" y="301" font-size="14" fill="#263a54">wordpress DB</text>

<path d="M224 195 H280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 168 H555" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 222 V283 H555" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M755 283 H810" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<text x="516" y="154" font-size="13" fill="#64748b">정적 파일</text>
<text x="516" y="271" font-size="13" fill="#64748b">PHP 요청</text>

<rect x="54" y="356" width="906" height="42" rx="9" fill="#fff" stroke="#cbd5e1"/>
<text x="76" y="382" font-size="14" fill="#475569">WordPress · phpMyAdmin은 /var/www/html에 위치하며, PHP 요청만 PHP-FPM을 거쳐 같은 컨테이너의 MariaDB를 사용</text>
</g></svg>