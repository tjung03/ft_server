<rect x="532" y="166" width="190" height="92" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="552" y="197" font-size="20" font-weight="700" fill="#163b76">PHP 7.3-FPM</text><text x="552" y="226" font-size="15" fill="#263a54">Unix socket</text>
